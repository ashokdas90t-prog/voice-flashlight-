name: Build Voice Flashlight FINAL
on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create complete Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/voiceflashlight
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          
          rootProject.name = "VoiceFlashlight"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }
          
          android {
              namespace 'com.example.voiceflashlight'
              compileSdk 35
          
              defaultConfig {
                  applicationId 'com.example.voiceflashlight'
                  minSdk 23
                  targetSdk 35
                  versionCode 5
                  versionName '5.0'
              }
          
              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowBackground">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.RECORD_AUDIO"/>
              <uses-permission android:name="android.permission.CAMERA"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE"/>
              <uses-permission android:name="android.permission.WAKE_LOCK"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
          
              <uses-feature android:name="android.hardware.camera.flash" android:required="false"/>
          
              <application
                  android:theme="@style/AppTheme"
                  android:label="Voice Flashlight"
                  android:allowBackup="false"
                  android:supportsRtl="true">
          
                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".VoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone"/>
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/voiceflashlight/MainActivity.java <<'EOF'
          package com.example.voiceflashlight;
          
          import android.Manifest;
          import android.app.Activity;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.View;
          import android.widget.Button;
          import android.widget.LinearLayout;
          import android.widget.TextView;
          
          import java.util.ArrayList;
          
          public class MainActivity extends Activity {
          
              private TextView status;
              private final int REQUEST = 501;
          
              private final BroadcastReceiver receiver = new BroadcastReceiver() {
                  @Override
                  public void onReceive(Context context, Intent intent) {
                      if ("VOICE_STATUS".equals(intent.getAction())) {
                          String message = intent.getStringExtra("message");
                          if (message != null && status != null) status.setText(message);
                      }
                  }
              };
          
              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
          
                  // পুরো স্ক্রিন কালো, লেখা/বাটন মাঝামাঝি; উপরে অতিরিক্ত margin.
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER_HORIZONTAL);
                  root.setBackgroundColor(Color.BLACK);
                  root.setPadding(dp(20), dp(70), dp(20), dp(30));
          
                  TextView title = new TextView(this);
                  title.setText("VOICE FLASHLIGHT");
                  title.setTextColor(Color.WHITE);
                  title.setTextSize(28);
                  title.setGravity(Gravity.CENTER);
                  title.setTypeface(null, 1);
          
                  TextView subtitle = new TextView(this);
                  subtitle.setText(
                      "বাংলা + English voice control\n\n" +
                      "বলুন: “ফ্ল্যাশ লাইট অন”\n" +
                      "বলুন: “ফ্ল্যাশ লাইট অফ”\n\n" +
                      "বা: “flashlight on” / “flashlight off”"
                  );
                  subtitle.setTextColor(Color.WHITE);
                  subtitle.setTextSize(17);
                  subtitle.setGravity(Gravity.CENTER);
                  subtitle.setPadding(0, dp(22), 0, dp(28));
          
                  status = new TextView(this);
                  status.setText("STATUS: STOPPED");
                  status.setTextColor(Color.LTGRAY);
                  status.setTextSize(16);
                  status.setGravity(Gravity.CENTER);
                  status.setPadding(0, 0, 0, dp(25));
          
                  Button start = makeButton("START VOICE CONTROL");
                  Button stop = makeButton("STOP VOICE CONTROL");
          
                  root.addView(title, matchWrap());
                  root.addView(subtitle, matchWrap());
                  root.addView(status, matchWrap());
                  root.addView(start, buttonParams());
                  root.addView(space(dp(12)));
                  root.addView(stop, buttonParams());
          
                  setContentView(root);
          
                  start.setOnClickListener(v -> requestPermissionsAndStart());
                  stop.setOnClickListener(v -> {
                      stopService(new Intent(this, VoiceService.class));
                      status.setText("STATUS: STOPPED");
                  });
              }
          
              private Button makeButton(String text) {
                  Button b = new Button(this);
                  b.setText(text);
                  b.setTextColor(Color.WHITE);
                  b.setTextSize(15);
                  b.setAllCaps(false);
                  b.setBackgroundColor(Color.rgb(35,35,35));
                  return b;
              }
          
              private LinearLayout.LayoutParams matchWrap() {
                  return new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT,
                          LinearLayout.LayoutParams.WRAP_CONTENT);
              }
          
              private LinearLayout.LayoutParams buttonParams() {
                  LinearLayout.LayoutParams p = new LinearLayout.LayoutParams(
                          LinearLayout.LayoutParams.MATCH_PARENT, dp(58));
                  return p;
              }
          
              private View space(int h) {
                  View v = new View(this);
                  v.setLayoutParams(new LinearLayout.LayoutParams(1, h));
                  return v;
              }
          
              private int dp(int v) {
                  return (int)(v * getResources().getDisplayMetrics().density + 0.5f);
              }
          
              private void requestPermissionsAndStart() {
                  ArrayList<String> list = new ArrayList<>();
          
                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED)
                      list.add(Manifest.permission.RECORD_AUDIO);
          
                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED)
                      list.add(Manifest.permission.CAMERA);
          
                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS)
                          != PackageManager.PERMISSION_GRANTED)
                      list.add(Manifest.permission.POST_NOTIFICATIONS);
          
                  if (list.isEmpty()) startVoiceService();
                  else requestPermissions(list.toArray(new String[0]), REQUEST);
              }
          
              @Override
              public void onRequestPermissionsResult(
                      int requestCode, String[] permissions, int[] results) {
                  super.onRequestPermissionsResult(requestCode, permissions, results);
                  if (requestCode != REQUEST) return;
          
                  for (int result : results) {
                      if (result != PackageManager.PERMISSION_GRANTED) {
                          status.setText("PERMISSION DENIED — Microphone + Camera Allow করুন");
                          return;
                      }
                  }
                  startVoiceService();
              }
          
              private void startVoiceService() {
                  Intent i = new Intent(this, VoiceService.class);
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(i);
                  else startService(i);
                  status.setText("STATUS: STARTING...");
              }
          
              @Override
              protected void onStart() {
                  super.onStart();
                  IntentFilter f = new IntentFilter("VOICE_STATUS");
                  if (Build.VERSION.SDK_INT >= 33)
                      registerReceiver(receiver, f, Context.RECEIVER_NOT_EXPORTED);
                  else
                      registerReceiver(receiver, f);
              }
          
              @Override
              protected void onStop() {
                  try { unregisterReceiver(receiver); } catch (Exception ignored) {}
                  super.onStop();
              }
          }
          EOF

          cat > app/src/main/java/com/example/voiceflashlight/VoiceService.java <<'EOF'
          package com.example.voiceflashlight;
          
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.Service;
          import android.content.Intent;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.os.Handler;
          import android.os.IBinder;
          import android.os.Looper;
          import android.os.PowerManager;
          import android.speech.RecognitionListener;
          import android.speech.RecognizerIntent;
          import android.speech.SpeechRecognizer;
          
          import java.util.ArrayList;
          import java.util.Locale;
          
          public class VoiceService extends Service {
          
              private SpeechRecognizer speech;
              private CameraManager camera;
              private String cameraId;
              private PowerManager.WakeLock wakeLock;
              private final Handler handler = new Handler(Looper.getMainLooper());
              private boolean stopped = false;
              private int languageTurn = 0;
          
              @Override
              public void onCreate() {
                  super.onCreate();
                  createNotification();
                  acquireWakeLock();
          
                  camera = (CameraManager)getSystemService(CAMERA_SERVICE);
                  findFlash();
          
                  if (!SpeechRecognizer.isRecognitionAvailable(this)) {
                      sendStatus("VOICE ERROR: Speech service নেই");
                      return;
                  }
          
                  speech = SpeechRecognizer.createSpeechRecognizer(this);
                  speech.setRecognitionListener(listener);
                  listen();
              }
          
              private void findFlash() {
                  try {
                      for (String id : camera.getCameraIdList()) {
                          Boolean available = camera.getCameraCharacteristics(id)
                                  .get(CameraCharacteristics.FLASH_INFO_AVAILABLE);
                          if (Boolean.TRUE.equals(available)) {
                              cameraId = id;
                              break;
                          }
                      }
                      if (cameraId == null) sendStatus("FLASH ERROR: flashlight পাওয়া যায়নি");
                  } catch (Exception e) {
                      sendStatus("FLASH ERROR: camera permission/check করুন");
                  }
              }
          
              private final RecognitionListener listener = new RecognitionListener() {
                  @Override public void onReadyForSpeech(Bundle params) {
                      sendStatus("LISTENING... / শুনছি...");
                  }
          
                  @Override public void onBeginningOfSpeech() {
                      sendStatus("HEARING... / শুনছি...");
                  }
          
                  @Override public void onResults(Bundle results) {
                      ArrayList<String> list =
                              results.getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION);
          
                      String best = (list != null && !list.isEmpty()) ? list.get(0) : "";
                      sendStatus("HEARD / শুনেছি: " + best);
                      handleCommand(normalize(best));
          
                      handler.postDelayed(() -> listen(), 250);
                  }
          
                  @Override public void onError(int error) {
                      handler.postDelayed(() -> listen(), 500);
                  }
          
                  @Override public void onRmsChanged(float rmsdB) {}
                  @Override public void onBufferReceived(byte[] buffer) {}
                  @Override public void onEndOfSpeech() {}
                  @Override public void onPartialResults(Bundle partialResults) {}
                  @Override public void onEvent(int eventType, Bundle params) {}
              };
          
              private String normalize(String s) {
                  return s.toLowerCase(Locale.ROOT)
                          .replace(" ", "")
                          .replace("-", "")
                          .replace("_", "");
              }
          
              private void handleCommand(String text) {
                  // বাংলা ও English—দুই ধরনের উচ্চারণ/লেখা ধরার জন্য বিস্তৃত keyword set.
                  boolean flash =
                          text.contains("flashlight") ||
                          text.contains("flashlight") ||
                          text.contains("torch") ||
                          text.contains("ফ্ল্যাশলাইট") ||
                          text.contains("ফ্ল্যাশ") ||
                          text.contains("ফ্লাশলাইট") ||
                          text.contains("ফ্লাশ") ||
                          text.contains("টর্চ");
          
                  boolean on =
                          text.contains("on") ||
                          text.contains("turnon") ||
                          text.contains("অন") ||
                          text.contains("চালু") ||
                          text.contains("জ্বাল") ||
                          text.contains("জাল");
          
                  boolean off =
                          text.contains("off") ||
                          text.contains("turnoff") ||
                          text.contains("অফ") ||
                          text.contains("বন্ধ") ||
                          text.contains("নিভ");
          
                  if (flash && on) {
                      setFlash(true);
                      sendStatus("FLASHLIGHT: ON 🔦");
                  } else if (flash && off) {
                      setFlash(false);
                      sendStatus("FLASHLIGHT: OFF");
                  }
              }
          
              private void listen() {
                  if (stopped || speech == null) return;
          
                  try {
                      Intent intent = new Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH);
                      intent.putExtra(
                              RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM);
          
                      // বাংলা ও English পালা করে চেষ্টা করে। ফোনে Google Speech Services-এ
                      // দুই ভাষা enabled থাকলে দুই ধরনের command সবচেয়ে ভালো কাজ করবে।
                      if (languageTurn % 2 == 0) {
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD");
                      } else {
                          intent.putExtra(RecognizerIntent.EXTRA_LANGUAGE, "en-US");
                      }
                      languageTurn++;
          
                      intent.putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false);
                      intent.putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5);
                      speech.startListening(intent);
          
                  } catch (Exception e) {
                      handler.postDelayed(() -> listen(), 1000);
                  }
              }
          
              private void setFlash(boolean enabled) {
                  try {
                      if (cameraId == null) {
                          sendStatus("FLASH ERROR: flashlight পাওয়া যায়নি");
                          return;
                      }
                      camera.setTorchMode(cameraId, enabled);
                  } catch (Exception e) {
                      sendStatus("FLASH ERROR: " + e.getClass().getSimpleName());
                  }
              }
          
              private void createNotification() {
                  String channelId = "voice_flashlight";
          
                  if (Build.VERSION.SDK_INT >= 26) {
                      NotificationChannel channel = new NotificationChannel(
                              channelId, "Voice Flashlight",
                              NotificationManager.IMPORTANCE_LOW);
                      getSystemService(NotificationManager.class)
                              .createNotificationChannel(channel);
                  }
          
                  Notification.Builder b = Build.VERSION.SDK_INT >= 26
                          ? new Notification.Builder(this, channelId)
                          : new Notification.Builder(this);
          
                  Notification n = b.setContentTitle("Voice Flashlight")
                          .setContentText("বাংলা + English voice control চলছে")
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setOngoing(true)
                          .build();
          
                  startForeground(10, n);
              }
          
              private void acquireWakeLock() {
                  PowerManager pm = (PowerManager)getSystemService(POWER_SERVICE);
                  wakeLock = pm.newWakeLock(
                          PowerManager.PARTIAL_WAKE_LOCK,
                          "VoiceFlashlight:VoiceControl");
                  wakeLock.acquire();
              }
          
              private void sendStatus(String message) {
                  Intent i = new Intent("VOICE_STATUS");
                  i.setPackage(getPackageName());
                  i.putExtra("message", message);
                  sendBroadcast(i);
              }
          
              @Override
              public void onDestroy() {
                  stopped = true;
                  handler.removeCallbacksAndMessages(null);
          
                  if (speech != null) {
                      try { speech.stopListening(); } catch (Exception ignored) {}
                      speech.destroy();
                      speech = null;
                  }
          
                  if (wakeLock != null && wakeLock.isHeld()) wakeLock.release();
                  super.onDestroy();
              }
          
              @Override
              public IBinder onBind(Intent intent) {
                  return null;
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlashlight-FINAL
          path: app/build/outputs/apk/debug/app-debug.apk
