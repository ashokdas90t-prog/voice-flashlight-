name: Build Flashlight Fullscreen Touch

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e

          mkdir -p app/src/main/java/com/example/flashlight
          mkdir -p app/src/main/res/values

          cat > settings.gradle <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "Flashlight"
          include(":app")
          EOF

          cat > build.gradle <<'EOF'
          plugins {
              id 'com.android.application' version '8.7.3' apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m
          android.useAndroidX=false
          EOF

          cat > app/build.gradle <<'EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'com.example.flashlight'
              compileSdk 35

              defaultConfig {
                  applicationId 'com.example.flashlight'
                  minSdk 23
                  targetSdk 35
                  versionCode 2
                  versionName '2.0'
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#000000</item>
                  <item name="android:navigationBarColor">#000000</item>
                  <item name="android:colorAccent">#FFFFFF</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA"/>

              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="false"/>

              <application
                  android:theme="@style/AppTheme"
                  android:label="Flashlight"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:screenOrientation="portrait"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                  </activity>

              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/flashlight/MainActivity.java <<'EOF'
          package com.example.flashlight;

          import android.Manifest;
          import android.app.Activity;
          import android.content.pm.PackageManager;
          import android.graphics.Color;
          import android.hardware.camera2.CameraCharacteristics;
          import android.hardware.camera2.CameraManager;
          import android.os.Bundle;
          import android.view.Gravity;
          import android.view.MotionEvent;
          import android.widget.LinearLayout;
          import android.widget.TextView;

          public class MainActivity extends Activity {

              private LinearLayout root;
              private TextView label;
              private String cameraId;
              private boolean flashlightOn = false;
              private boolean permissionRequesting = false;

              private final int YELLOW = Color.rgb(255, 235, 0);

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);

                  root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.setGravity(Gravity.CENTER);
                  root.setBackgroundColor(Color.BLACK);

                  label = new TextView(this);
                  label.setText("FLASHLIGHT\nOFF");
                  label.setTextColor(Color.WHITE);
                  label.setTextSize(28);
                  label.setGravity(Gravity.CENTER);
                  label.setTypeface(null, 1);
                  label.setPadding(40, 40, 40, 40);

                  root.addView(label,
                          new LinearLayout.LayoutParams(
                                  LinearLayout.LayoutParams.MATCH_PARENT,
                                  LinearLayout.LayoutParams.MATCH_PARENT));

                  setContentView(root);
                  findFlashlight();

                  root.setOnTouchListener((v, event) -> {
                      if (event.getAction() == MotionEvent.ACTION_UP) {
                          toggleFlashlight();
                      }
                      return true;
                  });

                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      permissionRequesting = true;
                      requestPermissions(
                              new String[]{Manifest.permission.CAMERA}, 10);
                  }
              }

              private void findFlashlight() {
                  try {
                      CameraManager manager =
                              (CameraManager) getSystemService(CAMERA_SERVICE);

                      for (String id : manager.getCameraIdList()) {
                          Boolean available =
                                  manager.getCameraCharacteristics(id)
                                          .get(CameraCharacteristics.FLASH_INFO_AVAILABLE);

                          if (Boolean.TRUE.equals(available)) {
                              cameraId = id;
                              break;
                          }
                      }
                  } catch (Exception ignored) {
                  }
              }

              private void toggleFlashlight() {
                  if (checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED) {
                      requestPermissions(
                              new String[]{Manifest.permission.CAMERA}, 10);
                      return;
                  }

                  setFlashlight(!flashlightOn);
              }

              private void setFlashlight(boolean on) {
                  try {
                      if (cameraId == null) {
                          findFlashlight();
                      }

                      if (cameraId == null) {
                          return;
                      }

                      CameraManager manager =
                              (CameraManager) getSystemService(CAMERA_SERVICE);

                      manager.setTorchMode(cameraId, on);
                      flashlightOn = on;

                      if (on) {
                          root.setBackgroundColor(YELLOW);
                          label.setText("FLASHLIGHT\nON");
                          label.setTextColor(Color.BLACK);
                      } else {
                          root.setBackgroundColor(Color.BLACK);
                          label.setText("FLASHLIGHT\nOFF");
                          label.setTextColor(Color.WHITE);
                      }

                  } catch (Exception ignored) {
                      flashlightOn = false;
                      root.setBackgroundColor(Color.BLACK);
                      label.setText("FLASHLIGHT\nOFF");
                      label.setTextColor(Color.WHITE);
                  }
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults) {

                  super.onRequestPermissionsResult(
                          requestCode, permissions, grantResults);

                  if (requestCode == 10 &&
                      grantResults.length > 0 &&
                      grantResults[0] == PackageManager.PERMISSION_GRANTED) {

                      permissionRequesting = false;
                  } else {
                      permissionRequesting = false;
                      flashlightOn = false;
                      root.setBackgroundColor(Color.BLACK);
                      label.setText("FLASHLIGHT\nOFF");
                      label.setTextColor(Color.WHITE);
                  }
              }

              @Override
              protected void onDestroy() {
                  try {
                      if (flashlightOn && cameraId != null) {
                          CameraManager manager =
                                  (CameraManager) getSystemService(CAMERA_SERVICE);
                          manager.setTorchMode(cameraId, false);
                      }
                  } catch (Exception ignored) {
                  }
                  super.onDestroy();
              }
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Flashlight-Fullscreen-Touch
          path: app/build/outputs/apk/debug/app-debug.apk
