name: Build Voice Flashlight

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Create Android project
        shell: bash
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/voiceflashlight
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "VoiceFlashlight"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m
          android.useAndroidX=false
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }
          android {
              namespace = "com.example.voiceflashlight"
              compileSdk = 35
              defaultConfig {
                  applicationId = "com.example.voiceflashlight"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 3
                  versionName = "3.0"
              }
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme" parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:statusBarColor">#808080</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-feature android:name="android.hardware.camera.flash" android:required="false" />
              <application android:theme="@style/AppTheme" android:label="Voice Flashlight" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
                  <service android:name=".VoiceService" android:exported="false" android:foregroundServiceType="microphone" />
              </application>
          </manifest>
          EOF

          cat > app/src/main/java/com/example/voiceflashlight/MainActivity.kt <<'EOF'
          package com.example.voiceflashlight

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {
              private val requestCode = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val title = TextView(this).apply {
                      text = "Voice Flashlight"
                      textSize = 28f
                      gravity = Gravity.CENTER
                      setPadding(10, 35, 10, 20)
                  }

                  val info = TextView(this).apply {
                      text = "Voice control\n\nSay:\n“ফ্ল্যাশ লাইট অন”\n“ফ্ল্যাশ লাইট অফ”\n\nor\n“flashlight on” / “flashlight off”"
                      textSize = 18f
                      setPadding(20, 10, 20, 25)
                  }

                  val start = Button(this).apply { text = "START VOICE CONTROL" }
                  val stop = Button(this).apply { text = "STOP VOICE CONTROL" }

                  val layout = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL
                      setPadding(20, 20, 20, 20)
                      addView(title)
                      addView(info)
                      addView(start)
                      addView(stop)
                  }

                  setContentView(layout)

                  start.setOnClickListener { requestPermissionsAndStart() }
                  stop.setOnClickListener { stopService(Intent(this, VoiceService::class.java)) }
              }

              private fun requestPermissionsAndStart() {
                  val permissions = ArrayList<String>()

                  if (checkSelfPermission(Manifest.permission.RECORD_AUDIO) != PackageManager.PERMISSION_GRANTED)
                      permissions.add(Manifest.permission.RECORD_AUDIO)

                  if (checkSelfPermission(Manifest.permission.CAMERA) != PackageManager.PERMISSION_GRANTED)
                      permissions.add(Manifest.permission.CAMERA)

                  if (Build.VERSION.SDK_INT >= 33 &&
                      checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      permissions.add(Manifest.permission.POST_NOTIFICATIONS)

                  if (permissions.isEmpty()) startVoiceService()
                  else requestPermissions(permissions.toTypedArray(), requestCode)
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(requestCode, permissions, grantResults)
                  if (requestCode == this.requestCode &&
                      grantResults.all { it == PackageManager.PERMISSION_GRANTED }) {
                      startVoiceService()
                  }
              }

              private fun startVoiceService() {
                  val intent = Intent(this, VoiceService::class.java)
                  if (Build.VERSION.SDK_INT >= 26) startForegroundService(intent)
                  else startService(intent)
              }
          }
          EOF

          cat > app/src/main/java/com/example/voiceflashlight/VoiceService.kt <<'EOF'
          package com.example.voiceflashlight

          import android.app.*
          import android.content.Intent
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.os.*
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import java.util.Locale

          class VoiceService : Service() {
              private lateinit var speech: SpeechRecognizer
              private lateinit var camera: CameraManager
              private var cameraId: String? = null
              private val handler = Handler(Looper.getMainLooper())

              override fun onCreate() {
                  super.onCreate()
                  createNotification()

                  camera = getSystemService(CAMERA_SERVICE) as CameraManager
                  try {
                      cameraId = camera.cameraIdList.firstOrNull { id ->
                          camera.getCameraCharacteristics(id)
                              .get(CameraCharacteristics.FLASH_INFO_AVAILABLE) == true
                      }
                  } catch (_: Exception) {}

                  if (!SpeechRecognizer.isRecognitionAvailable(this)) return

                  speech = SpeechRecognizer.createSpeechRecognizer(this)
                  speech.setRecognitionListener(object : RecognitionListener {
                      override fun onResults(results: Bundle) {
                          val text = results
                              .getStringArrayList(SpeechRecognizer.RESULTS_RECOGNITION)
                              ?.joinToString(" ")
                              ?.lowercase(Locale.getDefault()) ?: ""
                          handleCommand(text)
                          listenAgain()
                      }

                      override fun onError(error: Int) {
                          handler.postDelayed({ listenAgain() }, 500)
                      }

                      override fun onReadyForSpeech(params: Bundle?) {}
                      override fun onBeginningOfSpeech() {}
                      override fun onRmsChanged(rmsdB: Float) {}
                      override fun onBufferReceived(buffer: ByteArray?) {}
                      override fun onEndOfSpeech() {}
                      override fun onPartialResults(partialResults: Bundle?) {}
                      override fun onEvent(eventType: Int, params: Bundle?) {}
                  })
                  listenAgain()
              }

              private fun handleCommand(text: String) {
                  val on =
                      (text.contains("ফ্ল্যাশ") &&
                       (text.contains("অন") || text.contains("চালু") || text.contains("জ্বাল"))) ||
                      text.contains("flashlight on") ||
                      text.contains("flash light on") ||
                      text.contains("torch on") ||
                      text.contains("ফ্লাশ লাইট অন") ||
                      text.contains("ফ্ল্যাশ লাইট অন") ||
                      text.contains("টর্চ অন")

                  val off =
                      (text.contains("ফ্ল্যাশ") &&
                       (text.contains("অফ") || text.contains("বন্ধ") || text.contains("নিভ"))) ||
                      text.contains("flashlight off") ||
                      text.contains("flash light off") ||
                      text.contains("torch off") ||
                      text.contains("ফ্লাশ লাইট অফ") ||
                      text.contains("ফ্ল্যাশ লাইট অফ") ||
                      text.contains("টর্চ অফ")

                  when {
                      on -> setFlash(true)
                      off -> setFlash(false)
                  }
              }

              private fun listenAgain() {
                  if (!::speech.isInitialized) return
                  try {
                      val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                              RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE, "bn-BD")
                          putExtra(RecognizerIntent.EXTRA_LANGUAGE_PREFERENCE, "bn-BD")
                          putExtra(RecognizerIntent.EXTRA_PARTIAL_RESULTS, false)
                          putExtra(RecognizerIntent.EXTRA_MAX_RESULTS, 5)
                      }
                      speech.startListening(intent)
                  } catch (_: Exception) {
                      handler.postDelayed({ listenAgain() }, 800)
                  }
              }

              private fun setFlash(enabled: Boolean) {
                  try { cameraId?.let { camera.setTorchMode(it, enabled) } }
                  catch (_: Exception) {}
              }

              private fun createNotification() {
                  val channelId = "voice_flashlight"
                  if (Build.VERSION.SDK_INT >= 26) {
                      val channel = NotificationChannel(
                          channelId, "Voice Flashlight",
                          NotificationManager.IMPORTANCE_LOW
                      )
                      getSystemService(NotificationManager::class.java)
                          .createNotificationChannel(channel)
                  }

                  val notification = if (Build.VERSION.SDK_INT >= 26)
                      Notification.Builder(this, channelId)
                  else Notification.Builder(this)

                  startForeground(
                      1,
                      notification
                          .setContentTitle("Voice Flashlight")
                          .setContentText("Voice control is active")
                          .setSmallIcon(android.R.drawable.ic_menu_camera)
                          .setOngoing(true)
                          .build()
                  )
              }

              override fun onDestroy() {
                  handler.removeCallbacksAndMessages(null)
                  if (::speech.isInitialized) {
                      speech.stopListening()
                      speech.destroy()
                  }
                  super.onDestroy()
              }

              override fun onBind(intent: Intent?): IBinder? = null
          }
          EOF

      - name: Install Gradle
        shell: bash
        run: |
          set -e
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"

      - name: Build APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlashlight-v3
          path: app/build/outputs/apk/debug/app-debug.apk
