name: Build Voice Flashlight APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Create Android project
        run: |

          mkdir -p app/src/main/java/com/example/voiceflashlight
          mkdir -p app/src/main/res/values

          cat > settings.gradle.kts <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }

          rootProject.name = "VoiceFlashlight"
          include(":app")
          EOF

          cat > build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
          }
          EOF

          cat > gradle.properties <<'EOF'
          org.gradle.jvmargs=-Xmx1536m
          android.useAndroidX=false
          kotlin.code.style=official
          EOF

          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.voiceflashlight"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.example.voiceflashlight"
                  minSdk = 23
                  targetSdk = 35
                  versionCode = 1
                  versionName = "1.0"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          EOF

          cat > app/src/main/res/values/styles.xml <<'EOF'
          <resources>
              <style name="AppTheme"
                  parent="android:style/Theme.Material.Light.NoActionBar">
                  <item name="android:fontFamily">sans</item>
                  <item name="android:colorAccent">#333333</item>
              </style>
          </resources>
          EOF

          cat > app/src/main/AndroidManifest.xml <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.CAMERA" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />

              <uses-feature
                  android:name="android.hardware.camera.flash"
                  android:required="false" />

              <application
                  android:theme="@style/AppTheme"
                  android:label="Voice Flashlight"
                  android:allowBackup="false"
                  android:supportsRtl="true">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true">

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                  </activity>

                  <service
                      android:name=".VoiceService"
                      android:exported="false"
                      android:foregroundServiceType="microphone" />

              </application>

          </manifest>
          EOF

          cat > app/src/main/java/com/example/voiceflashlight/MainActivity.kt <<'EOF'
          package com.example.voiceflashlight

          import android.Manifest
          import android.app.Activity
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.os.Build
          import android.os.Bundle
          import android.view.Gravity
          import android.widget.Button
          import android.widget.LinearLayout
          import android.widget.TextView

          class MainActivity : Activity() {

              private val requestCode = 100

              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)

                  val title = TextView(this)
                  title.text = "Voice Flashlight"
                  title.textSize = 26f
                  title.gravity = Gravity.CENTER
                  title.setPadding(10, 40, 10, 20)

                  val info = TextView(this)
                  info.text =
                      "Voice control for flashlight\\n\\n" +
                      "Say:\\n" +
                      "\"flashlight on\"\\n" +
                      "\"flashlight off\""
                  info.textSize = 18f
                  info.setPadding(20, 20, 20, 30)

                  val startButton = Button(this)
                  startButton.text = "START VOICE CONTROL"

                  val stopButton = Button(this)
                  stopButton.text = "STOP VOICE CONTROL"

                  val layout = LinearLayout(this)
                  layout.orientation = LinearLayout.VERTICAL
                  layout.setPadding(25, 25, 25, 25)

                  layout.addView(title)
                  layout.addView(info)
                  layout.addView(startButton)
                  layout.addView(stopButton)

                  setContentView(layout)

                  startButton.setOnClickListener {
                      requestPermissionsIfNeeded()
                  }

                  stopButton.setOnClickListener {
                      stopService(
                          Intent(this, VoiceService::class.java)
                      )
                  }
              }

              private fun requestPermissionsIfNeeded() {

                  val permissions = ArrayList<String>()

                  if (
                      Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.RECORD_AUDIO)
                          != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(Manifest.permission.RECORD_AUDIO)
                  }

                  if (
                      Build.VERSION.SDK_INT >= 23 &&
                      checkSelfPermission(Manifest.permission.CAMERA)
                          != PackageManager.PERMISSION_GRANTED
                  ) {
                      permissions.add(Manifest.permission.CAMERA)
                  }

                  if (permissions.isNotEmpty()) {
                      requestPermissions(
                          permissions.toTypedArray(),
                          requestCode
                      )
                  } else {
                      startVoiceService()
                  }
              }

              override fun onRequestPermissionsResult(
                  requestCode: Int,
                  permissions: Array<out String>,
                  grantResults: IntArray
              ) {
                  super.onRequestPermissionsResult(
                      requestCode,
                      permissions,
                      grantResults
                  )

                  if (requestCode == this.requestCode) {

                      var granted = true

                      for (result in grantResults) {
                          if (result != PackageManager.PERMISSION_GRANTED) {
                              granted = false
                          }
                      }

                      if (granted) {
                          startVoiceService()
                      }
                  }
              }

              private fun startVoiceService() {

                  val intent =
                      Intent(this, VoiceService::class.java)

                  if (Build.VERSION.SDK_INT >= 26) {
                      startForegroundService(intent)
                  } else {
                      startService(intent)
                  }
              }
          }
          EOF

          cat > app/src/main/java/com/example/voiceflashlight/VoiceService.kt <<'EOF'
          package com.example.voiceflashlight

          import android.app.Notification
          import android.app.NotificationChannel
          import android.app.NotificationManager
          import android.app.Service
          import android.content.Intent
          import android.hardware.camera2.CameraCharacteristics
          import android.hardware.camera2.CameraManager
          import android.os.Build
          import android.os.Bundle
          import android.os.Handler
          import android.os.IBinder
          import android.os.Looper
          import android.speech.RecognitionListener
          import android.speech.RecognizerIntent
          import android.speech.SpeechRecognizer
          import java.util.Locale

          class VoiceService : Service() {

              private lateinit var speech: SpeechRecognizer
              private lateinit var camera: CameraManager
              private var cameraId: String? = null

              override fun onCreate() {
                  super.onCreate()

                  createNotification()

                  camera =
                      getSystemService(CAMERA_SERVICE) as CameraManager

                  try {
                      cameraId =
                          camera.cameraIdList.firstOrNull { id ->

                              camera.getCameraCharacteristics(id)
                                  .get(
                                      CameraCharacteristics.FLASH_INFO_AVAILABLE
                                  ) == true
                          }
                  } catch (_: Exception) {
                  }

                  speech =
                      SpeechRecognizer.createSpeechRecognizer(this)

                  speech.setRecognitionListener(
                      object : RecognitionListener {

                          override fun onResults(results: Bundle) {

                              val text =
                                  results.getStringArrayList(
                                      SpeechRecognizer.RESULTS_RECOGNITION
                                  )
                                      ?.joinToString(" ")
                                      ?.lowercase(Locale.getDefault())
                                      ?: ""

                              if (
                                  text.contains("flashlight on") ||
                                  text.contains("flash light on") ||
                                  text.contains("torch on") ||
                                  text.contains("ফ্ল্যাশলাইট অন") ||
                                  text.contains("টর্চ অন") ||
                                  text.contains("टॉर्च ऑन") ||
                                  text.contains("टॉर्च ऑन करो")
                              ) {
                                  setFlash(true)
                              }

                              if (
                                  text.contains("flashlight off") ||
                                  text.contains("flash light off") ||
                                  text.contains("torch off") ||
                                  text.contains("ফ্ল্যাশলাইট অফ") ||
                                  text.contains("টর্চ অফ") ||
                                  text.contains("टॉर्च ऑफ") ||
                                  text.contains("टॉर्च ऑफ करो")
                              ) {
                                  setFlash(false)
                              }

                              listenAgain()
                          }

                          override fun onError(error: Int) {
                              Handler(Looper.getMainLooper())
                                  .postDelayed(
                                      {
                                          listenAgain()
                                      },
                                      700
                                  )
                          }

                          override fun onReadyForSpeech(
                              params: Bundle?
                          ) {}

                          override fun onBeginningOfSpeech() {}

                          override fun onRmsChanged(
                              rmsdB: Float
                          ) {}

                          override fun onBufferReceived(
                              buffer: ByteArray?
                          ) {}

                          override fun onEndOfSpeech() {}

                          override fun onPartialResults(
                              partialResults: Bundle?
                          ) {}

                          override fun onEvent(
                              eventType: Int,
                              params: Bundle?
                          ) {}
                      }
                  )

                  listenAgain()
              }

              private fun listenAgain() {

                  try {

                      val intent =
                          Intent(
                              RecognizerIntent.ACTION_RECOGNIZE_SPEECH
                          )

                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE_MODEL,
                          RecognizerIntent.LANGUAGE_MODEL_FREE_FORM
                      )

                      intent.putExtra(
                          RecognizerIntent.EXTRA_LANGUAGE,
                          Locale.getDefault().toLanguageTag()
                      )

                      intent.putExtra(
                          RecognizerIntent.EXTRA_PARTIAL_RESULTS,
                          false
                      )

                      speech.startListening(intent)

                  } catch (_: Exception) {
                  }
              }

              private fun setFlash(enabled: Boolean) {

                  try {

                      cameraId?.let { id ->
                          camera.setTorchMode(id, enabled)
                      }

                  } catch (_: Exception) {
                  }
              }

              private fun createNotification() {

                  val channelId = "voice_flashlight"

                  if (Build.VERSION.SDK_INT >= 26) {

                      val channel =
                          NotificationChannel(
                              channelId,
                              "Voice Flashlight",
                              NotificationManager.IMPORTANCE_LOW
                          )

                      val manager =
                          getSystemService(
                              NotificationManager::class.java
                          )

                      manager.createNotificationChannel(channel)
                  }

                  val notification =
                      if (Build.VERSION.SDK_INT >= 26) {

                          Notification.Builder(
                              this,
                              channelId
                          )

                      } else {

                          Notification.Builder(this)

                      }
                          .setContentTitle("Voice Flashlight")
                          .setContentText(
                              "Listening for flashlight commands"
                          )
                          .setSmallIcon(
                              android.R.drawable.ic_menu_camera
                          )
                          .setOngoing(true)
                          .build()

                  startForeground(
                      1,
                      notification
                  )
              }

              override fun onDestroy() {

                  if (::speech.isInitialized) {
                      speech.destroy()
                  }

                  super.onDestroy()
              }

              override fun onBind(
                  intent: Intent?
              ): IBinder? {
                  return null
              }
          }
          EOF


      - name: Install Gradle
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.10.2-bin.zip
          unzip -q gradle-8.10.2-bin.zip
          echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"


      - name: Build APK
        run: |
          gradle assembleDebug


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFlashlight-APK
          path: app/build/outputs/apk/debug/app-debug.apk
